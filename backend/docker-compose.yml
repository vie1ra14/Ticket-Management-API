services:
  db:
    image: postgres:16
    container_name: ticket_management_db
    restart: always
    environment:
      POSTGRES_USER: vieira
      POSTGRES_PASSWORD: vieira223
      POSTGRES_DB: ticket_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
